name: Daily Code Checks

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/volunteer_platform 
           

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build